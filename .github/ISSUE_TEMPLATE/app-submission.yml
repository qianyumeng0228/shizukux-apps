name: 应用提交
description: 向 ShizukuX 应用商店提交一个应用（需先有公开 Release 直链）
title: "[App] "
labels: ["app-submission"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请确认：APK 已有公开可下载的 Release 直链，并算好 SHA-256。审核通过后条目会合并进 `apps.json`。
  - type: input
    id: app_name
    attributes:
      label: 应用名称
      placeholder: 星野scene
    validations:
      required: true
  - type: input
    id: package_name
    attributes:
      label: 包名
      placeholder: com.omarea.vtools
    validations:
      required: true
  - type: input
    id: version_name
    attributes:
      label: 版本名
      placeholder: N1 2026.10 Alpha14 Lite Relay
    validations:
      required: true
  - type: input
    id: version_code
    attributes:
      label: 版本号（versionCode，纯数字）
      placeholder: "920261010"
    validations:
      required: true
  - type: input
    id: download_url
    attributes:
      label: 下载直链（GitHub Release 资产）
      placeholder: https://github.com/you/repo/releases/download/v1.0/app.apk
    validations:
      required: true
  - type: input
    id: sha256
    attributes:
      label: SHA-256
      placeholder: 64 位十六进制
    validations:
      required: true
  - type: input
    id: size_bytes
    attributes:
      label: 文件大小（字节）
      placeholder: "8468270"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 应用简介
      description: 一两句话说明它能做什么、依赖什么
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: 标签（逗号分隔，最多 6 个）
      placeholder: 性能, 调度
  - type: input
    id: source_repo
    attributes:
      label: 开源仓库（可选）
      placeholder: https://github.com/you/repo
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我确认该 APK 来源合法，且直链可公开下载
          required: true
